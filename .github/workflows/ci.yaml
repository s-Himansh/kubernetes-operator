name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Gofmt
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Setup envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          mkdir -p /tmp/kubebuilder
          BIN=$(go env GOPATH)/bin/setup-envtest
          KUBEBUILDER_ASSETS=$($BIN use 1.30 --bin-dir /tmp/kubebuilder -p path)
          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS" >> $GITHUB_ENV
      - name: Test (unit + webhook)
        run: go test -v -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build -o /tmp/manager ./cmd/main.go

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m

  trivy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      # Advisory for now: k8s 0.30 stack pulls x/net v0.25 / oauth2 v0.12
      # with 8 HIGH CVEs. TODO: bump to k8s 0.32+/go 1.23+, then gate exit-code 1.
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/s-himansh/kubernetes-operator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/ && rm kubeconform.tar.gz
      - run: helm lint ./charts/kubernetes-operator
      - run: helm template test ./charts/kubernetes-operator | kubeconform -strict -skip CustomResourceDefinition -summary
      - run: helm template test ./charts/kubernetes-operator --set webhook.enabled=true | kubeconform -strict -skip CustomResourceDefinition -summary
