apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/s-Himansh/kubernetes-operator
    targetRevision: HEAD
    path: charts/kubernetes-operator
    helm:
      values: |
        image:
          tag: latest
  destination:
    server: https://kubernetes.default.svc
    namespace: cache-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
