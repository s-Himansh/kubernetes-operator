# Opt-in cert-manager resources for webhook TLS.
# Apply with: kubectl apply -f config/certmanager/ (requires cert-manager).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: shardedcache-selfsigned-issuer
  namespace: cache-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shardedcache-serving-cert
  namespace: cache-system
spec:
  dnsNames:
    - webhook-service.cache-system.svc
    - webhook-service.cache-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: shardedcache-selfsigned-issuer
  secretName: webhook-server-cert
