{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubernetes-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernetes-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubernetes-operator.fullname" . }}-manager-role
  labels:
    {{- include "kubernetes-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cache.example.com"]
    resources: ["shardedcaches"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["cache.example.com"]
    resources: ["shardedcaches/status","shardedcaches/finalizers"]
    verbs: ["get","update","patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["services","events"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubernetes-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "kubernetes-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubernetes-operator.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "kubernetes-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
