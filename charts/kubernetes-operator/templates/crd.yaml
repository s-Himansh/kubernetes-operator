{{- if .Values.crd.keep }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shardedcaches.cache.example.com
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: cache.example.com
  names:
    kind: ShardedCache
    listKind: ShardedCacheList
    plural: shardedcaches
    shortNames: [sc]
    singular: shardedcache
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Shards
          type: integer
          jsonPath: .spec.shards
        - name: Ready
          type: integer
          jsonPath: .status.readyShards
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                shards: {type: integer, minimum: 1, maximum: 64, default: 16}
                cacheSizePerShard: {type: integer, minimum: 1, default: 1000}
                image: {type: string, minLength: 1, default: "{{ .Values.cache.defaultImage }}"}
                version: {type: string}
                resources: {type: object, x-kubernetes-preserve-unknown-fields: true}
            status:
              type: object
              properties:
                readyShards: {type: integer}
                phase: {type: string}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
{{- end }}
